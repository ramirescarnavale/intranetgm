name: Deploy para cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publicar arquivos via API do cPanel (File Manager)
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          # Caminho relativo à home do cPanel onde fica o site (subpasta advrc.com.br/intranetgm)
          DESTINO_BASE: "public_html/intranetgm"
        run: |
          set -e

          echo "Testando conectividade com ${CPANEL_HOST}:2083..."
          curl -s -S -o /dev/null -w "HTTP %{http_code} (conectou em %{time_connect}s)\n" \
            --connect-timeout 10 --max-time 20 \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/get_file_information?dir=/&file=." \
            || { echo "Não foi possível conectar em ${CPANEL_HOST}:2083 — verifique host, firewall ou se a API está habilitada."; exit 1; }

          uapi() {
            # Chama a UAPI do cPanel e falha se status != 1, mesmo com HTTP 200
            # (a UAPI pode responder 200 com um erro lógico no corpo JSON).
            local resposta codigo corpo status
            resposta=$(curl -s -S -w "\n%{http_code}" \
              --connect-timeout 10 --max-time 30 \
              -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
              "$@")
            codigo=$(echo "$resposta" | tail -n1)
            corpo=$(echo "$resposta" | sed '$d')
            status=$(echo "$corpo" | jq -r '.status // empty')

            if [ "$codigo" != "200" ] || [ "$status" != "1" ]; then
              echo "$corpo"
              return 1
            fi
            return 0
          }

          # Cria as pastas de destino (mkdir não é recursivo, então cria nível a nível).
          git ls-files public_html | sed "s|^public_html|${DESTINO_BASE}|" | xargs -n1 dirname | sort -u | while read -r caminho; do
            IFS='/' read -ra partes <<< "$caminho"
            acumulado=""
            for parte in "${partes[@]}"; do
              pai="$acumulado"
              acumulado="${acumulado:+$acumulado/}$parte"
              echo "Garantindo pasta: $acumulado"
              uapi --data-urlencode "path=/${pai}" --data-urlencode "name=${parte}" \
                "https://${CPANEL_HOST}:2083/execute/Fileman/mkdir" \
                | grep -qi "already exists" && true || true
            done
          done

          git ls-files public_html | while read -r arquivo; do
            destino_rel="${DESTINO_BASE}/${arquivo#public_html/}"
            dir=$(dirname "$destino_rel")
            base=$(basename "$destino_rel")

            echo "Publicando: $destino_rel"

            if ! uapi --data-urlencode "dir=/${dir}" \
                 --data-urlencode "file=${base}" \
                 --data-urlencode "content@${arquivo}" \
                 "https://${CPANEL_HOST}:2083/execute/Fileman/save_file_content"; then
              echo "Falha ao publicar $destino_rel"
              exit 1
            fi
          done
