name: Deploy para cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publicar arquivos via API do cPanel (File Manager)
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          # Caminho relativo à home do cPanel onde fica o site (subpasta advrc.com.br/intranetgm)
          DESTINO_BASE: "public_html/intranetgm"
        run: |
          set -e

          echo "Testando conectividade com ${CPANEL_HOST}:2083..."
          curl -s -S -o /dev/null -w "HTTP %{http_code} (conectou em %{time_connect}s)\n" \
            --connect-timeout 10 --max-time 20 \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/get_file_information?dir=/&file=." \
            || { echo "Não foi possível conectar em ${CPANEL_HOST}:2083 — verifique host, firewall ou se a API está habilitada."; exit 1; }

          uapi_status() {
            # Extrai o "status" do corpo JSON da UAPI (1 = sucesso, 0 = erro lógico,
            # que pode vir junto de HTTP 200 — por isso não basta checar o código HTTP).
            echo "$1" | jq -r '.status // empty'
          }

          git ls-files public_html | while read -r arquivo; do
            destino_rel="${DESTINO_BASE}/${arquivo#public_html/}"
            dir=$(dirname "$destino_rel")
            base=$(basename "$destino_rel")

            echo "Publicando: $destino_rel"

            # upload_files cria OU sobrescreve — é o único método da UAPI que cria arquivo novo.
            resposta=$(curl -s -S --connect-timeout 10 --max-time 60 \
              -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_API_TOKEN}" \
              -F "dir=/${dir}" \
              -F "file-1=@${arquivo};filename=${base}" \
              "https://${CPANEL_HOST}:2083/execute/Fileman/upload_files")

            if [ "$(uapi_status "$resposta")" != "1" ]; then
              echo "Falha ao publicar $destino_rel: $resposta"
              exit 1
            fi
          done
